<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor de Escritura Académica - ISSF</title>
    <style>
        :root {
            --primary-color: #800020; /* Bordó institucional */
            --secondary-color: #f4f4f9;
            --text-color: #333333;
            --accent-color: #d9a74a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* Contenedor embebido del Chatbot */
        #chat-frame {
            width: 100%;
            max-width: 950px;
            height: 700px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            background: #ffffff;
        }

        footer {
            background-color: var(--primary-color);
            color: #ffffff;
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            #chat-frame {
                height: 80vh;
            }
            header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Instituto Superior La Sagrada Familia</h1>
        <p>Portal del Tutor de Escritura Académica</p>
    </header>

    <main>
        <!-- Chatbot embebido en el centro de la pantalla mediante Iframe directo -->
        <iframe 
            id="chat-frame"
            src="https://mediafiles.botpress.cloud/bf310b8f-36c7-4ebc-8a27-a066928eeb3b/webchat/v2/shareable.html"
            title="Tutor de Escritura Académica">
        </iframe>
    </main>

    <footer>
        <p>&copy; 2026 Instituto Superior La Sagrada Familia | Plataforma Educativa de Acompañamiento Académico</p>
    </footer>

</body>
</html>
