<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor de Escritura Académica - ISSF</title>
    <style>
        :root {
            --primary-color: #800020; /* Bordó institucional */
            --secondary-color: #f4f4f9;
            --text-color: #333333;
            --accent-color: #d9a74a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        footer {
            background-color: var(--primary-color);
            color: #ffffff;
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Estilos para forzar el Webchat al centro como panel principal */
        .bp-widget-widget {
            position: relative !important;
            right: auto !important;
            bottom: auto !important;
            width: 100% !important;
            max-width: 900px !important;
            height: 680px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15) !important;
            border-radius: 12px !important;
            overflow: hidden !important;
        }

        /* Ocultar el botón/burbuja flotante de la esquina */
        .bp-widget-btn {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Instituto Superior La Sagrada Familia</h1>
        <p>Portal del Tutor de Escritura Académica</p>
    </header>

    <main>
        <!-- El script inyectará la ventana del chat directamente aquí -->
    </main>

    <footer>
        <p>&copy; 2026 Instituto Superior La Sagrada Familia | Plataforma Educativa de Acompañamiento Académico</p>
    </footer>

    <!-- Script Oficial de Botpress Webchat -->
    <script src="https://cdn.botpress.cloud/webchat/v2.2/inject.js"></script>
    <script>
      window.botpress.init({
        "botId": "bf310b8f-36c7-4ebc-8a27-a066928eeb3b",
        "clientId": "bf310b8f-36c7-4ebc-8a27-a066928eeb3b",
        "configuration": {
          "showPowerBy": false,
          "autofocus": true
        }
      });

      // Abrir automáticamente la ventana al cargar
      window.botpress.on("webchat:ready", () => {
        window.botpress.open();
      });
    </script>
</body>
</html>
